<script>
(function(){
var MO=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
var MS=['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'];
var TN={D:'DTF',U:'UV DTF',P:'Press',X:'Boshqa'};
var D=null,O=[],P=[],tab='home',F={type:'all',per:'all',from:'',to:''},R={from:'',to:''},auth={i:'',k:'',c:''},dbg={loc:0,hash:0,hi:0,kp:0,tw:0};
var app=document.getElementById('app'),tabs=document.getElementById('tabs'),rv=document.getElementById('rv'),rvb=document.getElementById('rvb');
var SHOW=false,RV_T=null,RV_N=0;
function mf(n){return SHOW?fmt(n):'•••••'}
function rvHide(){
 if(RV_T){clearInterval(RV_T);RV_T=null}
 SHOW=!!(D&&D.admin);
 var sh=document.querySelectorAll('.shade'),i;for(i=0;i<sh.length;i++){var w=sh[i].parentNode;if(w&&w.parentNode)w.parentNode.removeChild(w)}
 if(D)render();
}
function rvShow(){
 if(!D||D.admin||RV_T)return;
 SHOW=true;RV_N=10;render();
 RV_T=setInterval(function(){RV_N--;if(RV_N<=0){rvHide()}else{rvb.textContent='👁 '+RV_N+' s · yashirish'}},1000);
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){n=Math.round(n||0);var s=String(Math.abs(n)),o='';while(s.length>3){o=','+s.slice(-3)+o;s=s.slice(0,-3)}return (n<0?'-':'')+s+o}
function fm(n){var s=(Math.round((n||0)*1000)/1000).toFixed(3);if(s.charAt(s.length-1)==='0')s=s.slice(0,-1);return s}
function fd(n){n=Math.round((n||0)*1000)/1000;return n===Math.floor(n)?fmt(n):fm(n)}
function dm(y){return y.slice(8,10)+'.'+y.slice(5,7)}
function dmy(y){return y.slice(8,10)+'.'+y.slice(5,7)+'.'+y.slice(0,4)}
function ym(y){return y.slice(0,7)}
function mname(k){return MO[Number(k.slice(5,7))-1]+' '+k.slice(0,4)}
function today(){return D&&D.now?D.now:new Date().toISOString().slice(0,10)}
function qtyTxt(o){return o.c==='P'?(fd(o.q)+' dona'):(fm(o.q)+' m')}
function pill(c){return '<span class="pill p-'+c+'">'+TN[c]+'</span>'}
function status(o){return o.db>0.5?(o.db<net(o)-0.5?'<small class="bad">qoldiq '+mf(o.db)+'</small>':'<small class="bad">to’lanmagan</small>'):'<small class="ok">to’langan</small>'}
function net(o){return (o.t||0)-(o.ds||0)}

function show(emoji,title,text,btn){
 tabs.hidden=true;document.getElementById('rf').hidden=true;rv.hidden=true;
 app.innerHTML='<div class="msg"><div class="e">'+emoji+'</div><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p>'+(btn?'<button type="button" id="again">'+esc(btn)+'</button>':'')+'</div>';
 var b=document.getElementById('again');if(b)b.onclick=function(){load(auth.c)};
